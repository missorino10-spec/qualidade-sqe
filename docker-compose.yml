services:
  postgres:
    # Mesma versao do banco em que o sistema foi validado (Supabase roda
    # PostgreSQL 17). Com a 16 o proprio backup da nuvem nem abre aqui: o
    # arquivo gerado pela 17 traz ajustes que a 16 nao conhece e a carga para
    # na primeira linha. Manter a mesma versao dos dois lados evita isso e
    # tira uma diferenca entre o que foi testado e o que vai rodar na fabrica.
    #
    # NAO trocar pela variante "-alpine". O Alpine usa outra biblioteca de
    # sistema (musl), que nao sabe ordenar texto por idioma - ela compara letra
    # por letra pelo codigo do caractere. Na pratica a lista de fornecedores
    # saia assim: "MM PLAST" antes de "Metalurgica", e "teste2" depois de "Weg".
    image: postgres:17
    container_name: qualidade-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qualidade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qualidade}
      POSTGRES_DB: ${POSTGRES_DB:-qualidade}
      LANG: en_US.utf8
      # Quem manda na ORDEM ALFABETICA de toda lista e todo relatorio do
      # sistema. Tem de ser exatamente o mesmo da nuvem onde o sistema foi
      # validado (PostgreSQL 17.6, provedor ICU, idioma en-US), senao muda
      # coisa que a fabrica ve: com a ordenacao do sistema operacional o
      # instrumento "PAQ009" vinha antes de "PAQ.015" e o micrometro
      # "(Lamina)" caia no fim do grupo, em vez do comeco. Mesmo dado, ordem
      # diferente da que foi conferida.
      #
      # Isto so vale na CRIACAO do banco: mudar depois nao reordena nada.
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=en-US --locale=en_US.utf8 --encoding=UTF8'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-qualidade}']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: qualidade-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-qualidade}:${POSTGRES_PASSWORD:-qualidade}@postgres:5432/${POSTGRES_DB:-qualidade}?schema=public
      # DIRECT_URL e obrigatoria no schema.prisma e sem ela o "prisma db push"
      # do docker-entrypoint.sh nem comeca. Aqui ela e igual a DATABASE_URL: o
      # Postgres e local, sem pooler no meio, entao a mesma conexao ja serve
      # para DDL. Na nuvem as duas diferem (6543 com pgbouncer x 5432 direta).
      DIRECT_URL: postgresql://${POSTGRES_USER:-qualidade}:${POSTGRES_PASSWORD:-qualidade}@postgres:5432/${POSTGRES_DB:-qualidade}?schema=public
      JWT_SECRET: ${JWT_SECRET:-troque-esta-chave-secreta}
      # Sem estas duas o seed aborta de proposito e o container nao sobe. Nao
      # tem valor padrao aqui: senha de admin com default viraria a senha real.
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      # Vazia = aceita qualquer origem (comportamento historico). Preenchida,
      # a API passa a atender so os enderecos da lista.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # O relogio do container e UTC por padrao. O sistema le a data GRAVADA em
      # UTC, mas pergunta "que dia e hoje" no relogio local - alerta de prazo,
      # vencimento de calibracao e a competencia corrente do IDF. Sem isto, das
      # 21h a meia-noite a fabrica veria o dia seguinte.
      TZ: ${TZ:-America/Sao_Paulo}
      UPLOAD_DIR: /app/uploads
      PORT: 3000
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build: ./frontend
    container_name: qualidade-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '${APP_PORT:-8080}:80'

volumes:
  postgres_data:
  uploads_data:
