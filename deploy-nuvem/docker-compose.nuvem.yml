# ============================================================
# Sistema de Qualidade (SQE) - Big Dutchman Brasil
# Stack de PRODUCAO na nuvem (VPS unico)
#
# Contem 4 servicos:
#   postgres  -> banco de dados (dados persistem no volume postgres_data)
#   backend   -> API NestJS (uploads persistem no volume uploads_data)
#   frontend  -> React compilado + nginx (proxy /api -> backend)
#   caddy     -> porta de entrada; faz HTTPS automatico se houver dominio
#
# Uso (a partir da raiz do projeto):
#   docker compose -f deploy-nuvem/docker-compose.nuvem.yml --env-file .env up -d
#
# Os caminhos de build sao relativos a ESTA pasta (deploy-nuvem/),
# por isso o "../backend" e "../frontend".
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: qualidade-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5
    # Sem "ports": o banco NAO fica exposto na internet.
    # Ele so e alcancavel pelos outros conteineres da rede interna.

  backend:
    build:
      context: ../backend
    container_name: qualidade-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      # DIRECT_URL e obrigatoria no schema.prisma: sem ela o "prisma db push"
      # do docker-entrypoint.sh nem comeca e o container morre antes de abrir a
      # porta. Aqui e igual a DATABASE_URL - o Postgres e do lado, sem pooler no
      # meio, entao a mesma conexao ja serve para DDL.
      DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      # Sem estas duas o seed aborta de proposito, para o sistema nao subir sem
      # nenhum usuario e sem aviso no log. Nao tem valor padrao: senha de admin
      # com default viraria a senha real - e este servidor fica na INTERNET.
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      # O relogio do container e UTC por padrao. O sistema le a data GRAVADA em
      # UTC, mas pergunta "que dia e hoje" no relogio local - prazo de RNC,
      # vencimento de calibracao e a competencia corrente do IDF. Sem isto, das
      # 21h a meia-noite a empresa enxergaria o dia seguinte.
      TZ: ${TZ:-America/Sao_Paulo}
      UPLOAD_DIR: /app/uploads
      PORT: 3000
      NODE_ENV: production
    volumes:
      - uploads_data:/app/uploads
    # Sem "ports": so o frontend/caddy conversam com a API.

  frontend:
    build:
      context: ../frontend
    container_name: qualidade-frontend
    restart: unless-stopped
    depends_on:
      - backend
    # Sem "ports": quem publica na internet e o Caddy.

  caddy:
    image: caddy:2-alpine
    container_name: qualidade-caddy
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # certificados HTTPS (Let's Encrypt) - persistente
      - caddy_config:/config

volumes:
  postgres_data:   # BANCO DE DADOS - o historico de tudo vive aqui
  uploads_data:    # anexos/fotos das inspecoes e RNCs
  caddy_data:      # certificados HTTPS
  caddy_config:
